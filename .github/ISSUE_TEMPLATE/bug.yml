name: Reporte de error
description: Algo no funciona como debería.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Lo que viste, y lo que esperabas ver.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Iniciar sesión como coach
        2. Abrir la lista de clientes
        3. ...
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y versión
      placeholder: Pixel 7, Android 15 — app 0.1.0+1
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o logs
