name: macrofit_app
description: "MacroFit: registro nutricional por foto y rutinas de entrenamiento con seguimiento de coach."
publish_to: 'none'

# versión semántica + número de build (versionCode en Android, CFBundleVersion en iOS).
version: 0.1.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_markdown_plus: ^1.0.12
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  blobatar: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fondos de las tarjetas destacadas (se muestran tenues bajo el color).
  assets:
    - assets/images/

  # Tipografía de la guía visual (lib/app/README.md). Inter, licencia SIL OFL 1.1
  # (assets/fonts/inter/OFL.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    # Íconos de Lucide (licencia ISC, assets/fonts/lucide/LICENSE.txt).
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide/lucide.ttf
