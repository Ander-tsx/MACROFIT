name: macrofit_app
description: "MacroFit: registro nutricional por foto y rutinas de entrenamiento con seguimiento de coach."
publish_to: 'none'

# versión semántica + número de build (versionCode en Android, CFBundleVersion en iOS).
version: 0.1.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
