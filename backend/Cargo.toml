[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = "3.1" # Conector oficial de MongoDB
jsonwebtoken = "9.3" # Manejo de tokens JWT
bcrypt = "0.15" # Encriptación de contraseñas
dotenvy = "0.15" # Manejo de archivo .env
tower-http = { version = "0.5", features = ["cors", "trace"] } # CORS
chrono = { version = "0.4", features = ["serde"] }