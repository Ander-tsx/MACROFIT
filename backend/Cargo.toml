[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "backend"
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "seed_exercises"
path = "src/bin/seed_exercises.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mongodb = "3.1" # Conector oficial de MongoDB
jsonwebtoken = "9.3" # Manejo de tokens JWT
argon2 = { version = "0.5", features = ["std"] } # Hash de contraseñas (Argon2id)
sha2 = "0.10" # SHA-256 de los refresh tokens
rand = "0.8" # Generación de refresh tokens aleatorios
dotenvy = "0.15" # Manejo de archivo .env
tower-http = { version = "0.5", features = ["cors", "trace"] } # CORS
chrono = { version = "0.4", features = ["serde"] }
futures-util = { version = "0.3", features = ["io"] } # Escribir y leer los streams de GridFS (fotos)
