openapi: 3.0.3
info:
  title: API MacroFit
  version: 1.0.0
  description: API REST de MacroFit.
servers:
  - url: http://localhost:3000/api/v1
    description: Desarrollo
tags:
  - name: Coach
    description: Operaciones exclusivas del rol coach.
  - name: Vinculaciones
    description: Vinculación entre un usuario y su coach.

paths:
  /coach/invite-code:
    get:
      tags: [Coach]
      summary: Obtener el código de invitación del coach (HU-12)
      description: >
        Devuelve el código de invitación del coach autenticado.
        Si todavía no tiene uno, se genera y se guarda.
      operationId: getInviteCode
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Código de invitación del coach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCoachOnly"

  /coach/invite-code/regenerate:
    post:
      tags: [Coach]
      summary: Regenerar el código de invitación del coach (HU-12)
      description: >
        Reemplaza el código actual del coach autenticado por uno nuevo y distinto.
        El código anterior deja de ser válido.
      operationId: regenerateInviteCode
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nuevo código de invitación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenCoachOnly"

  /users/me/coach-link:
    post:
      tags: [Vinculaciones]
      summary: Vincularse con un coach mediante su código de invitación (HU-13)
      description: >
        El usuario autenticado se vincula con el coach dueño del código.
        El código se normaliza (sin espacios alrededor y en mayúsculas).
        Si ya existía una vinculación previa con ese coach, se reactiva.
        Un usuario solo puede tener una vinculación activa a la vez.
      operationId: linkCoach
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkCoachRequest"
      responses:
        "201":
          description: Vinculación activa creada o reactivada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenUserOnly"
        "404":
          $ref: "#/components/responses/InviteCodeNotFound"
        "409":
          $ref: "#/components/responses/UserAlreadyLinked"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    InviteCodeResponse:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[A-Z0-9]{6}$"
          example: "K7P2QX"
          description: Código de 6 caracteres alfanuméricos en mayúsculas (A-Z0-9).

    LinkCoachRequest:
      type: object
      required: [invite_code]
      properties:
        invite_code:
          type: string
          example: "K7P2QX"
          description: Código de invitación del coach. No distingue mayúsculas ni espacios alrededor.

    CoachLinkResponse:
      type: object
      required: [id, coach_id, coach_name, coach_email, status]
      properties:
        id:
          type: string
          example: "6720c1f4a1b2c3d4e5f60718"
          description: Id de la vinculación.
        coach_id:
          type: string
          example: "6720c1f4a1b2c3d4e5f60719"
        coach_name:
          type: string
          example: "Laura Pérez"
        coach_email:
          type: string
          format: email
          example: "laura@example.com"
        status:
          type: string
          enum: [active]
          example: active

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code:
              type: string
              example: FORBIDDEN_ROLE
            message:
              type: string
            fields:
              type: object
              description: Errores por campo (nombre del campo a mensaje). Vacío si no aplica.
              additionalProperties:
                type: string

  responses:
    BadRequest:
      description: >
        Cuerpo inválido. `VALIDATION_ERROR` si falta `invite_code` o viene vacío;
        `INVALID_BODY` si el JSON está mal formado o un campo tiene un tipo incorrecto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: Hay campos inválidos
              fields:
                invite_code: invite_code es obligatorio
    Unauthorized:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: Token inválido o expirado
              fields: {}
    ForbiddenCoachOnly:
      description: La cuenta autenticada no tiene rol coach.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN_ROLE
              message: Acceso restringido a coaches
              fields: {}
    ForbiddenUserOnly:
      description: La cuenta autenticada es un coach; esta función es solo para usuarios.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: FORBIDDEN_ROLE
              message: Esta función es solo para usuarios
              fields: {}
    InviteCodeNotFound:
      description: El código no existe o ya no está vigente.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVITE_CODE_NOT_FOUND
              message: El código de invitación no existe o ya no está vigente
              fields: {}
    UserAlreadyLinked:
      description: El usuario ya tiene una vinculación activa con un coach.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: USER_ALREADY_LINKED
              message: Ya tienes una vinculación activa con un coach
              fields: {}
